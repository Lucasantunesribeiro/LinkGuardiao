services:
  postgres:
    image: postgres:16-alpine
    container_name: linkguardiao-postgres
    environment:
      POSTGRES_DB: linkguardiao
      POSTGRES_USER: linkguardiao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkguardiao}
    ports:
      - "54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkguardiao -d linkguardiao"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: linkguardiao-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  redis:
    image: redis:7-alpine
    container_name: linkguardiao-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # API ASP.NET Core em container (opcional): docker compose --profile app up -d --build
  # Usa STORAGE_PROVIDER=postgresql. Aplique as migrations antes (ver readme.md).
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/LinkGuardiao.Api/Dockerfile
    container_name: linkguardiao-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      STORAGE_PROVIDER: postgresql
      POSTGRESQL_CONNECTION_STRING: Host=postgres;Port=5432;Database=linkguardiao;Username=linkguardiao;Password=${POSTGRES_PASSWORD:-linkguardiao}
      REDIS_CONNECTION_STRING: redis:6379
      JWT__SECRET: ${JWT__SECRET:-}
      JWT__ISSUER: ${JWT__ISSUER:-LinkGuardiao}
      JWT__AUDIENCE: ${JWT__AUDIENCE:-LinkGuardiao}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      LINKLIMITS__DAILYUSERCREATELIMIT: ${LINKLIMITS__DAILYUSERCREATELIMIT:-100}
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  dynamodb_data:
  redis_data:
